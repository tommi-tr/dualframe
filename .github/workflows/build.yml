name: iOS – Build IPA (manuale)
# Solo su richiesta (Actions › Run workflow): i Mac di GitHub consumano più minuti gratuiti.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (unsigned)
        run: |
          xcodebuild -project DualFrame.xcodeproj -target DualFrame -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD" build.log || true
          test -d build/Release-iphoneos/DualFrame.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/DualFrame.app Payload/
          zip -qry DualFrame.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DualFrame-ipa
          path: ios/DualFrame.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios/build.log
