name: Android – Build APK
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test e build
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk CameraDual.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CameraDual-apk
          path: android/CameraDual.apk
      # Ogni nuova versionName diventa una "release" su GitHub con l'APK allegato:
      # è lì che l'app controlla se c'è un aggiornamento.
      - name: Pubblica la versione
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "La versione v$VER esiste già"
          else
            gh release create "v$VER" CameraDual.apk --title "Camera Dual $VER" \
              --notes "APK per Android. Aprilo sul telefono per aggiornare (si installa sopra la versione precedente)."
          fi
